<style>

.row{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:860px){.row{grid-template-columns:repeat(4,1fr);gap:20px}}
.pc{position:relative}

.im svg.b{opacity:0}

.sc{position:fixed;inset-inline:0;bottom:0;z-index:15;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:space-between}

.bn{position:fixed;inset-inline:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:16;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;display:flex;justify-content:space-around;height:64px;box-shadow:var(--sh)}

dialog{border:0;border-radius:var(--r);padding:28px;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:var(--sh)}

 var cats=CATS.map(function(c){var dk=c[2]==='#2a2826';return '<a class="cat" href="#shop" data-c="'+c[0]+'" style="background:'+c[2]+';color:'+(dk?'#f2efea':'#141312')+'"><svg viewBox="0 0 200 200" style="color:currentColor">'+G+'</svg>'+c[1]+'</a>'}).join('');
 var nw=P.filter(function(p){return p.nw}).slice(0,4).map(card).join(''),bs=P.filter(function(p){return p.bs}).slice(0,4).map(card).join('');
 var gal=[0,1,2,3,4,5].map(function(i){var p=P[i*2%12];return '<div>'+gm(p.a,p.b)+'</div>'}).join('');
 return '<section class="hero"><svg viewBox="0 0 200 200">'+G+'</svg><div class="t"><small>مجموعه زمستان ۱۴۰۵</small><h1>سکوتِ شیک</h1><p>برش‌های ساده، پارچه‌های سنگین و رنگ‌های خنثی؛ برای روزهایی که نمی‌خواهید دیده شوید، فقط حس شوید.</p><a class="btn" href="#shop">دیدن مجموعه</a></div></section>'+

 '<section class="sec"><div class="ltd"><small>تعداد محدود · ۱۲۰ عدد</small><h2>کتِ ملانژ، نسخه شماره‌دار</h2><p style="max-width:48ch;opacity:.8;margin:0">هر کت یک شماره دارد و فقط یک‌بار تولید می‌شود.</p><a class="btn" href="#p-5">خرید نسخه محدود</a></div></section>'+
 '<section class="sec"><div class="hd"><h2>نظر مشتریان</h2></div><div class="rev"><div class="rv">★★★★★<p>پارچهٔ هودی از چیزی که فکر می‌کردم سنگین‌تر و بهتر بود. سایزبندی دقیق.</p><span>مریم، تهران</span></div><div class="rv">★★★★★<p>بسته‌بندی عالی و ارسال دو روزه به شیراز. شلوار دقیقاً مثل عکس.</p><span>سینا، شیراز</span></div><div class="rv">★★★★☆<p>مانتو خیلی شیک است، فقط یک سایز بزرگ‌تر بگیرید.</p><span>الهه، اصفهان</span></div></div></section>'+

 var l=P.filter(function(p){return F.c==='all'||p.c===F.c});

 return '<div class="w" style="padding-top:28px"><h2>فروشگاه</h2><div class="fl" style="margin-top:18px">'+chips+'</div><div class="tb"><span style="color:var(--mut)">'+fa(l.length)+' محصول</span><select id="so" aria-label="مرتب‌سازی"><option value="new">جدیدترین</option><option value="best">پرفروش‌ترین</option><option value="lo">ارزان‌ترین</option><option value="hi">گران‌ترین</option></select></div><div class="row">'+l.slice((F.pg-1)*per,F.pg*per).map(card).join('')+'</div>'+(pages>1?'<div class="pg">'+pg+'</div>':'')+'</div>'+foot()}
var sel={};
function prod(id){
 var p=P[id-1];if(!p)return shop();sel={c:p.a,s:''};
 var rel=P.filter(function(x){return x.c===p.c&&x.id!==p.id}).concat(P.filter(function(x){return x.c!==p.c})).slice(0,4).map(card).join('');
 var ic=function(d){return '<svg viewBox="0 0 24 24">'+d+'</svg>'};
 return '<div class="w"><div class="pd"><div class="gl"><div class="im" data-z>'+gm(p.a,p.b)+'</div><div class="im" data-z>'+gm(p.b,p.a)+'</div><div class="im" data-z>'+gm(p.a,"#cfc8bc")+'</div></div>'+
 '<div class="inf"><small style="color:var(--mut)">نیلوفر · کد '+fa(1000+p.id)+'</small><h2 style="margin:4px 0 8px">'+p.n+'</h2><div style="font-size:22px;font-weight:600">'+fa(p.p)+' تومان</div><p style="color:var(--mut)">برش راحت، پارچهٔ ۳۲۰ گرمی و دوخت دوبل. مناسب استفادهٔ روزمره و لایه‌گذاری.</p>'+
 '<b>رنگ</b><div class="sw">'+[p.a,p.b,'#8e877b'].map(function(c,i){return '<button class="dot'+(i?'':' on')+'" data-col="'+c+'" style="background:'+c+'" aria-label="رنگ"></button>'}).join('')+'</div>'+
 '<div style="display:flex;justify-content:space-between"><b>سایز</b><button data-sg style="text-decoration:underline;color:var(--mut)">راهنمای سایز</button></div><div class="sz">'+['S','M','L','XL'].map(function(s){return '<button data-sz="'+s+'">'+s+'</button>'}).join('')+'</div>'+
 '<div class="fa"><div>'+ic('<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="1.500"/><circle cx="17" cy="17" r="1.500"/>')+'ارسال ۲۴ ساعته در تهران، ۳ تا ۵ روز شهرستان</div><div>'+ic('<path d="M4 12a8 8 0 1 0 3-6M4 4v4h4"/>')+'بازگشت و تعویض تا ۷ روز</div><div>'+ic('<path d="M12 3l8 4v5c0 5-3.500 8-8 9-4.500-1-8-4-8-9V7l8-4Z"/>')+'پارچهٔ کتان ۱۰۰٪ · شست‌وشو در ۳۰ درجه</div></div></div></div>'+
 '<section class="sec"><div class="hd"><h2>نظر خریداران</h2></div><div class="rev"><div class="rv">★★★★★<p>دقیقاً همان چیزی که می‌خواستم؛ دوخت عالی.</p><span>نگار</span></div><div class="rv">★★★★☆<p>رنگ کمی تیره‌تر از عکس است ولی خیلی خوب است.</p><span>امیر</span></div></div></section>'+
 '<section class="sec"><div class="hd"><h2>شاید بپسندید</h2></div><div class="row">'+rel+'</div></section></div>'+foot()+
 '<div class="sc"><div><b>'+p.n+'</b><div style="color:var(--mut);font-size:14px">'+fa(p.p)+' تومان</div></div><button class="btn" data-add>افزودن به سبد</button></div>'}
var app=document.getElementById('app');
function route(){var h=location.hash.slice(1)||'home',v;
 if(h.indexOf('p-')===0)v=prod(parseInt(h.slice(2),10));else if(h==='shop')v=shop();else v=home();
 app.innerHTML=v;window.scrollTo(0,0);
 var k=h.indexOf('p-')===0?'shop':h;document.querySelectorAll('.bn a[data-n]').forEach(function(a){a.classList.toggle('on',a.dataset.n===k)});
 var so=document.getElementById('so');if(so)so.value=F.s}
window.addEventListener('hashchange',route);
function dlg(h){var d=document.getElementById('dl');d.innerHTML=h+'<form method="dialog" style="margin-top:16px"><button class="btn o" style="width:100%">بستن</button></form>';d.showModal()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-w],[data-q],[data-f],[data-pg],[data-col],[data-sz],[data-sg],[data-add],[data-c]');if(e.target.closest('#ct,#bc'))return toast('سبد: '+fa(C)+' کالا');if(e.target.closest('#wl,#bw'))return toast('علاقه‌مندی‌ها: '+fa(Object.keys(W).length));if(!t)return;var d=t.dataset;
 if(d.w){e.preventDefault();var i=d.w;if(W[i])delete W[i];else W[i]=1;t.classList.toggle('on');upd();toast(W[i]?'به علاقه‌مندی‌ها اضافه شد':'حذف شد')}
 else if(d.q){var p=P[d.q-1];dlg('<div class="im" style="margin-bottom:14px">'+gm(p.a,p.b)+'</div><b>'+p.n+'</b><p>'+fa(p.p)+' تومان</p><a class="btn" href="#p-'+p.id+'" onclick="document.getElementById(\'dl\').close()">مشاهده محصول</a>')}
 else if(d.f){F.c=d.f;F.pg=1;route()}else if(d.pg){F.pg=+d.pg;route()}else if(d.c){F.c=d.c;F.pg=1}
 else if(d.col){sel.c=d.col;document.querySelectorAll('.dot').forEach(function(x){x.classList.toggle('on',x===t)})}
 else if(d.sz){sel.s=d.sz;document.querySelectorAll('.sz button').forEach(function(x){x.classList.toggle('on',x===t)})}
 else if(d.sg){dlg('<h3 style="margin-top:0">راهنمای سایز</h3><table><tr><th>سایز</th><th>سینه</th><th>قد</th></tr><tr><td>S</td><td>۹۶</td><td>۶۸</td></tr><tr><td>M</td><td>۱۰۰</td><td>۷۰</td></tr><tr><td>L</td><td>۱۰۶</td><td>۷۲</td></tr><tr><td>XL</td><td>۱۱۲</td><td>۷۴</td></tr></table>')}
 else if(d.hasOwnProperty('add')){if(!sel.s)return toast('سایز را انتخاب کنید');C++;upd();toast('به سبد اضافه شد')}});
document.addEventListener('change',function(e){if(e.target.id==='so'){F.s=e.target.value;F.pg=1;route()}});
document.addEventListener('mousemove',function(e){var z=e.target.closest('[data-z]');if(!z)return;var r=z.getBoundingClientRect(),s=z.querySelector('svg');s.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%'});
route();
</script>
